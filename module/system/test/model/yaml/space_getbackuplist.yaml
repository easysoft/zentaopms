---
title: ops_space
desc: Test data for space table used in systemModel::getBackupList() method
author: Codex
version: "2.0"

fields:
- field: id
  note: Space ID
  range: 1-5
- field: name
  note: Space name
  range: test-space{2}, prod-space{2}, dev-space{1}
- field: code
  range: code{1-5}
- field: acl
  range: open
- field: auth
  range: extend
- field: desc
  range: ""
- field: createdBy
  range: admin{2}, user{2}, tester{1}
- field: editedBy
  range: admin
- field: deleted
  note: Delete status
  range: 0{4}, 1{1}
  note: Creator
  range: admin{3}, user{2}
  format: ""

- field: createdAt
  note: Creation time
  range: (now)-(2w)
  format: YYYY-MM-DD hh:mm:ss
