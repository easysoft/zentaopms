title: ops_repo
desc: 代码库表基础数据定义（对齐db/zentao.sql）
author: Codex
version: "2.0"
fields:
- field: id
  range: 1-100
- field: spaceID
  range: 1-10
- field: product
  range: "1"
- field: name
  range: repo{1-100}
- field: desc
  range: "测试代码库{1-100}"
- field: scmType
  range: git
- field: gitUID
  range: uid{1-100}
- field: forkID
  range: 0
- field: mirror
  range: 0
- field: providerID
  range: 0
- field: connector
  range: ""
- field: defaultBranch
  range: ""
- field: acl
  range: open
- field: status
  range: active
- field: synced
  range: 1
- field: branchArchivable
  range: 0
- field: createdBy
  range: admin
- field: editedBy
  range: admin
- field: deleted
  range: 0
