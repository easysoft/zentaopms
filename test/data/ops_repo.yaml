title: table ops_repo
desc: "代码库表"
author: automated export
version: "1.0"
fields:
  - field: id
    note: "代码库ID"
    range: "1-10000"
  - field: spaceID
    note: "空间ID"
    range: "0,1,2,3"
  - field: product
    note: "关联产品"
    range: "1,2,3"
  - field: name
    note: "代码库唯一标识"
    range: "zentao-web,zentao-api,zentao-mobile"
  - field: SCM
    note: "源代码管理类型"
    range: "git,svn"
  - field: gitUID
    note: "Git仓库唯一标识"
    range: "gituid000000000000000000000000000000000001,gituid000000000000000000000000000000000002,gituid000000000000000000000000000000000003"
  - field: providerID
    note: "源代码提供商ID"
    range: "0,1,2,3"
  - field: mirror
    note: "是否为镜像库（0=普通库，1=镜像库）"
    range: "0,1"
  - field: acl
    note: "权限:private,open"
    range: "open,private"
  - field: status
    note: "代码库状态"
    range: "active,inactive"
  - field: deleted
    note: "是否删除"
    range: "0"
