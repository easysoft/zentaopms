title: table ops_schedule_jobs
desc: "后台任务表"
author: automated export
version: "1.0"
fields:
  - field: id
    note: "任务ID，自增主键"
    range: "1-10000"
  - field: name
    note: "任务唯一标识"
    range: "pipeline-sync,scan-dispatch,webhook-delivery"
  - field: type
    note: "任务类型"
    range: "pipeline,scan,webhook"
  - field: priority
    note: "任务优先级"
    range: "1,5,10"
  - field: data
    note: "任务数据（JSON格式）"
    range: "job-data-sync,job-data-scan,job-data-hook"
  - field: result
    note: "任务结果（JSON格式）"
    range: "job-result-success,job-result-failed,job-result-pending"
  - field: maxDurationSeconds
    note: "最大执行时长（秒）"
    range: "60,300,1800"
  - field: maxRetries
    note: "最大重试次数"
    range: "0,1,3"
  - field: state
    note: "任务状态"
    range: "pending,running,success,failed,canceled"
  - field: scheduled
    note: "计划执行时间"
    range: "(M)-(w)"
    type: "timestamp"
    format: "YYYY-MM-DD hh:mm:ss"
  - field: totalExecutions
    note: "总执行次数"
    range: "0,1,5"
  - field: runBy
    note: "执行者"
    range: "system,scheduler,admin"
  - field: runDeadline
    note: "执行截止时间"
    range: "(M)-(w)"
    type: "timestamp"
    format: "YYYY-MM-DD hh:mm:ss"
  - field: runProgress
    note: "执行进度"
    range: "0,50,100"
  - field: lastExecuted
    note: "最后执行时间"
    range: "(M)-(w)"
    type: "timestamp"
    format: "YYYY-MM-DD hh:mm:ss"
  - field: isRecurring
    note: "是否为周期性任务，0-否，1-是"
    range: "0,1"
  - field: recurringCron
    note: "周期性任务Cron表达式"
    range: "0 0 * * *,*/10 * * * *,0 2 * * 1"
  - field: consecutiveFailures
    note: "连续失败次数"
    range: "0,1,2"
  - field: lastFailureError
    note: "最后失败错误信息"
    range: "timeout,network-error,permission-denied"
  - field: groupID
    note: "任务组ID"
    range: "group-ci,group-scan,group-hook"
  - field: createdBy
    note: "由谁创建"
    range: "admin,user1,user2"
  - field: createdDate
    note: "创建时间"
    range: "(M)-(w)"
    type: "timestamp"
    format: "YYYY-MM-DD hh:mm:ss"
  - field: editedBy
    note: "由谁编辑"
    range: "admin,user1,user2"
  - field: editedDate
    note: "编辑时间"
    range: "(M)-(w)"
    type: "timestamp"
    format: "YYYY-MM-DD hh:mm:ss"
  - field: deleted
    note: "是否删除"
    range: "0"
