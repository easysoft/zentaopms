title: table ops_scan_rule_migrations
desc: "扫描规则迁移记录表"
author: automated export
version: "1.0"
fields:
  - field: id
    note: "ID"
    range: "1-10000"
  - field: name
    note: "迁移名称"
    range: "init-rules,seed-java-rules,seed-php-rules"
  - field: version
    note: "迁移版本"
    range: "1.0.0,1.1.0,2.0.0"
  - field: createdBy
    note: "由谁创建"
    range: "admin,user1,user2"
  - field: createdDate
    note: "创建时间"
    range: "(M)-(w)"
    type: "timestamp"
    format: "YYYY-MM-DD hh:mm:ss"
  - field: deleted
    note: "是否删除"
    range: "0"
